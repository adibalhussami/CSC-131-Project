<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Log a Pickup</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: appNav}"></div>
<main>
    <h1 class="page-title">Log a Pickup</h1>
    <p class="banner" th:if="${submitted}">Pickup logged. Thanks!</p>

    <form class="record-form" th:action="@{/records}" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div>
            <label for="location">Location</label>
            <select id="location" name="location" required
                    onchange="document.getElementById('building').value=this.options[this.selectedIndex].dataset.building">
                <option value="" disabled selected>Select a location&hellip;</option>
                <option th:each="loc : ${locations}"
                        th:value="${loc.location}"
                        th:data-building="${loc.building}"
                        th:text="${loc.building} + ' — ' + ${loc.location}"></option>
            </select>
            <input type="hidden" id="building" name="building"/>
        </div>

        <div>
            <label for="binId">Bin ID (optional)</label>
            <input id="binId" name="binId" type="text" placeholder="e.g. CSUS-ALP-LF-01"/>
        </div>

        <div>
            <label for="driverName">Driver</label>
            <input id="driverName" name="driverName" type="text" required/>
        </div>

        <div>
            <label for="wasteStream">Waste Stream</label>
            <select id="wasteStream" name="wasteStream" required>
                <option th:each="stream : ${wasteStreams}" th:value="${stream}" th:text="${stream}"></option>
            </select>
        </div>

        <div>
            <label for="fullnessPercent">Fullness (%)</label>
            <input id="fullnessPercent" name="fullnessPercent" type="number" min="0" max="100" required/>
        </div>

        <div>
            <label for="contamination">Contamination</label>
            <select id="contamination" name="contamination" required>
                <option th:each="level : ${contaminationLevels}" th:value="${level}" th:text="${level}"></option>
            </select>
        </div>

        <div class="checkbox-row">
            <input type="hidden" name="overflow" value="false"/>
            <input id="overflow" name="overflow" type="checkbox" value="true"/>
            <label for="overflow" style="margin: 0;">Bin is overflowing / waste outside the bin</label>
        </div>

        <div>
            <label for="comments">Comments (optional)</label>
            <textarea id="comments" name="comments" rows="3"></textarea>
        </div>

        <button class="btn" type="submit">Log Pickup</button>
    </form>
</main>
</body>
</html>
