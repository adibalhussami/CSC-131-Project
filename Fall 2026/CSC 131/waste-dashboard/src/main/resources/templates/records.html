<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pickup Records</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: appNav}"></div>
<main>
    <h1 class="page-title">Pickup Records</h1>
    <p class="banner" th:if="${importedCount != null}" th:text="'Imported ' + ${importedCount} + ' record(s).'"></p>

    <form class="filter-bar" th:action="@{/records}" method="get">
        <div>
            <label for="building">Building</label>
            <select id="building" name="building">
                <option value="">All buildings</option>
                <option th:each="b : ${buildings}" th:value="${b}" th:text="${b}"
                        th:selected="${b == filter.building()}"></option>
            </select>
        </div>
        <div>
            <label for="driverName">Driver</label>
            <select id="driverName" name="driverName">
                <option value="">All drivers</option>
                <option th:each="d : ${drivers}" th:value="${d}" th:text="${d}"
                        th:selected="${d == filter.driverName()}"></option>
            </select>
        </div>
        <div>
            <label for="wasteStream">Waste Stream</label>
            <select id="wasteStream" name="wasteStream">
                <option value="">All streams</option>
                <option th:each="s : ${wasteStreams}" th:value="${s}" th:text="${s}"
                        th:selected="${s == filter.wasteStream()}"></option>
            </select>
        </div>
        <div>
            <label for="from">From</label>
            <input id="from" name="from" type="date" th:value="${filter.from()}"/>
        </div>
        <div>
            <label for="to">To</label>
            <input id="to" name="to" type="date" th:value="${filter.to()}"/>
        </div>
        <button type="submit">Filter</button>
    </form>

    <div class="toolbar">
        <form th:action="@{/records/import}" method="post" enctype="multipart/form-data" style="display:flex; gap:8px; align-items:center;">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="file" name="file" accept=".csv" required/>
            <button class="btn btn-secondary" type="submit">Import CSV</button>
        </form>
        <a class="btn"
           th:href="@{/records/export.csv(building=${filter.building()}, driverName=${filter.driverName()}, wasteStream=${filter.wasteStream()}, from=${filter.from()}, to=${filter.to()})}">
            Export CSV
        </a>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Date</th>
                <th>Building</th>
                <th>Location</th>
                <th>Bin ID</th>
                <th>Driver</th>
                <th>Stream</th>
                <th>Fullness</th>
                <th>Status</th>
                <th>Contamination</th>
                <th>Overflow</th>
                <th>Comments</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${records}" th:classappend="${r.overflow} ? 'needs-attention' : ''">
                <td th:text="${#temporals.format(r.collectionDate, 'MMM d, h:mm a')}"></td>
                <td th:text="${r.building}"></td>
                <td th:text="${r.location}"></td>
                <td th:text="${r.binId}"></td>
                <td th:text="${r.driverName}"></td>
                <td th:text="${r.wasteStream}"></td>
                <td th:text="${r.fullnessPercent} + '%'"></td>
                <td>
                    <span class="status-chip"
                          th:classappend="'status-' + ${#strings.toLowerCase(r.fullnessStatus)}"
                          th:text="${r.fullnessStatus}"></span>
                </td>
                <td th:text="${r.contamination}"></td>
                <td th:text="${r.overflow} ? 'Yes' : 'No'"></td>
                <td th:text="${r.comments}"></td>
            </tr>
            </tbody>
        </table>
        <p class="empty-state" th:if="${#lists.isEmpty(records)}">No pickup records match these filters.</p>
    </div>
</main>
</body>
</html>
