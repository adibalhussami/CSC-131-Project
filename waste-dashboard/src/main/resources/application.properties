spring.application.name=waste-dashboard

# File-based H2 database so data survives restarts (stored under ./data, gitignored)
spring.datasource.url=jdbc:h2:file:./data/wastedashboard;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Admin login for the dashboard/records pages. The pickup-intake form (/records/new)
# stays public regardless. Change these before sharing the app with anyone else.
wastedashboard.admin.username=admin
wastedashboard.admin.password=wastedashboard

server.port=8080
